services:
  directarr:
    image: ghcr.io/cjpoirrier/directarr:latest
    # Uncomment to build locally instead of pulling:
    # build: .
    container_name: directarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Run as root so bind-mounted ./config is always writable for SQLite.
    # (Host files owned by root/UID mismatch are the usual "readonly database" cause.)
    user: "0:0"
    environment:
      TZ: America/Chicago
      DIRECTARR_API_KEY: ${DIRECTARR_API_KEY:-change-this-long-random-key}
      # Web UI login (Sonarr-style). Change these after first boot.
      DIRECTARR_AUTH_MODE: ${DIRECTARR_AUTH_MODE:-forms}
      DIRECTARR_AUTH_USERNAME: ${DIRECTARR_AUTH_USERNAME:-admin}
      DIRECTARR_AUTH_PASSWORD: ${DIRECTARR_AUTH_PASSWORD:-admin}
      DIRECTARR_CONFIG_DIR: /config
      DIRECTARR_DOWNLOAD_DIR: /downloads
      DIRECTARR_STAGING_DIR: /staging
      DIRECTARR_MAX_DOWNLOAD_MB: ${DIRECTARR_MAX_DOWNLOAD_MB:-20000}
      # Parallel connections for HTTPS direct downloads (Drive uses API, not this)
      DIRECTARR_DOWNLOAD_CONNECTIONS: ${DIRECTARR_DOWNLOAD_CONNECTIONS:-8}
      DIRECTARR_DOWNLOAD_MULTI_MIN_MB: ${DIRECTARR_DOWNLOAD_MULTI_MIN_MB:-8}
      DIRECTARR_ALLOWED_HOSTS: ${DIRECTARR_ALLOWED_HOSTS:-}
    volumes:
      # Explicit :rw — required so SQLite can create the DB + WAL/journal files
      - ./config:/config:rw
      - ./downloads:/downloads:rw
      - ./staging:/staging:rw
    # Root filesystem locked down; only the volumes above are writable.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      # Give uvicorn + DB init time after rebuild before marking unhealthy
      start_period: 45s
      retries: 5
