  <div id="sync-profile-modal" class="modal hidden">
    <div class="modal-card">
      <div class="row between">
        <h2 id="sync-profile-modal-title">Sync Profile</h2>
        <button type="button" class="btn sm" id="sync-profile-modal-close">✕</button>
      </div>
      <form id="sync-profile-form" class="settings-grid" style="margin-top:1rem">
        <input type="hidden" id="profile-edit-id" value="" />
        <div class="settings-label">Name</div>
        <div class="settings-field">
          <input id="profile-name" type="text" required placeholder="Standard" />
        </div>
        <div class="settings-label">Enable RSS</div>
        <div class="settings-field">
          <label class="switch"><input type="checkbox" id="profile-rss" checked /><span class="slider"></span></label>
        </div>
        <div class="settings-label">Automatic Search</div>
        <div class="settings-field">
          <label class="switch"><input type="checkbox" id="profile-auto" checked /><span class="slider"></span></label>
        </div>
        <div class="settings-label">Interactive Search</div>
        <div class="settings-field">
          <label class="switch"><input type="checkbox" id="profile-interactive" checked /><span class="slider"></span></label>
        </div>
        <div class="settings-label">Minimum Seeders</div>
        <div class="settings-field">
          <input id="profile-seeders" type="number" min="0" value="1" />
          <p class="hint">Reserved for torrent indexers; ignored for direct downloads.</p>
        </div>
      </form>
      <div class="row" style="margin-top:1.25rem;justify-content:flex-end;gap:0.5rem">
        <button type="button" class="btn" id="sync-profile-modal-cancel">Cancel</button>
        <button type="button" class="btn primary" id="sync-profile-modal-save">Save</button>
      </div>
    </div>
  </div>
​
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
