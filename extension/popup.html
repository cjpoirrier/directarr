<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font: 13px system-ui, sans-serif; margin: 12px; }
    button { background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; padding: 6px 10px; }
    button:hover { background: #2563eb; }
    .quality { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    .quality button { width: auto; }
    #title { font-weight: 600; margin: 0 0 8px; word-break: break-word; }
    #status { font-size: 12px; color: #666; margin-top: 8px; }
    .settings { margin-top: 12px; padding-top: 8px; border-top: 1px solid #eee; font-size: 12px; }
    .settings input { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 4px; }
    label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="title">Loading…</div>
  <label><input type="checkbox" id="includeSubs" /> Include subtitles</label>
  <div id="qualities"></div>
  <div id="status"></div>

  <div class="settings">
    <button id="toggleSettings" type="button" style="background:#64748b; width:100%;">Settings</button>
    <div id="settingsPanel" class="hidden">
      <input id="directarrUrl" placeholder="http://localhost:8787" />
      <button id="save" type="button">Save URL</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
