services:
  directarr:
    build: .
    container_name: directarr
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: America/Chicago
      DIRECTARR_API_KEY: ${DIRECTARR_API_KEY:-change-this-long-random-key}
      DIRECTARR_USERNAME: ${DIRECTARR_USERNAME:-admin}
      DIRECTARR_PASSWORD: ${DIRECTARR_PASSWORD:-}
      DIRECTARR_SESSION_SECRET: ${DIRECTARR_SESSION_SECRET:-}
      DIRECTARR_CONFIG_DIR: /config
      DIRECTARR_DOWNLOAD_DIR: /downloads
      DIRECTARR_STAGING_DIR: /staging
      DIRECTARR_MAX_DOWNLOAD_MB: ${DIRECTARR_MAX_DOWNLOAD_MB:-20000}
      DIRECTARR_ALLOWED_HOSTS: ${DIRECTARR_ALLOWED_HOSTS:-}
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./staging:/staging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
