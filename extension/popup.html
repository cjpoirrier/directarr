<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font: 13px system-ui, sans-serif; margin: 12px; }
    input, button { width: 100%; box-sizing: border-box; margin: 4px 0; padding: 6px; }
    button { background: #3b82f6; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #2563eb; }
    .quality { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid #eee; }
    .quality button { width: auto; padding: 4px 10px; }
    label { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
    #status { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <div>
    <input id="directarrUrl" placeholder="Directarr URL (e.g. http://10.0.0.93:8787)" />
    <button id="save">Save URL</button>
  </div>
  <label><input type="checkbox" id="includeSubs" /> Include subtitles</label>
  <div id="qualities"></div>
  <button id="scan">Scan Page</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
