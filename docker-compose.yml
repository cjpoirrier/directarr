services:
  directarr:
    image: ghcr.io/cjpoirrier/directarr:latest
    # Uncomment to build locally instead of pulling:
    # build: .
    container_name: directarr
    shm_size: "2gb"
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Run as root so bind-mounted ./config is always writable for SQLite.
    user: "0:0"
    environment:
      TZ: America/Chicago
      # Required. Set these in a .env file next to this compose file.
      DIRECTARR_API_KEY: ${DIRECTARR_API_KEY:?Set DIRECTARR_API_KEY in .env}
      DIRECTARR_AUTH_PASSWORD: ${DIRECTARR_AUTH_PASSWORD:?Set DIRECTARR_AUTH_PASSWORD in .env}
      # Paths inside the container (match the volumes below). Do not change unless you also change the mounts.
      DIRECTARR_CONFIG_DIR: /config
      DIRECTARR_DOWNLOAD_DIR: /downloads
      DIRECTARR_STAGING_DIR: /staging
    volumes:
      - ./config:/config:rw
      - ./downloads:/downloads:rw
      - ./staging:/staging:rw
      - ./camoufox-data:/root/.camoufox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
