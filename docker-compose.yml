services:
  directarr:
    image: ghcr.io/cjpoirrier/directarr:latest
    # Uncomment to build locally instead of pulling:
    # build: .
    container_name: directarr
    shm_size: "2gb"
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Run as root so bind-mounted ./config is always writable for SQLite.
    user: "0:0"
    environment:
      TZ: America/Chicago
      # Required. Set these in a .env file next to this compose file.
      DIRECTARR_AUTH_USERNAME: admin
      DIRECTARR_AUTH_PASSWORD: admin
    volumes:
      - ./config:/config:rw
      - ./downloads:/downloads:rw
      - ./staging:/staging:rw
      - ./camoufox-data:/root/.camoufox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
